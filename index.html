<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="Offline Bhabhi card tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Bhabhi Card Tracker</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111c2e;--line:#29364a;--muted:#9aa9bd;--green:#23b477;--red:#ef6464}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f5f7fb;font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
main{max-width:620px;margin:0 auto;padding:12px 0 20px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:20px;margin:0;letter-spacing:.2px}
.tag{font-size:11px;color:#a9e9cd;border:1px solid #28654e;border-radius:20px;padding:4px 8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.num{font-size:25px;font-weight:750;line-height:1.1}
.sub{font-size:11px;color:var(--muted);margin-top:3px}
.track{height:6px;background:#253247;border-radius:20px;overflow:hidden;margin:0 0 12px}
.fill{height:100%;width:0;background:var(--green);transition:width .15s}
.deck{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.suit{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 5px;min-width:0}
.suit-head{text-align:center;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:5px}
.symbol{font-size:23px;line-height:1.05;font-weight:800}
.count{font-size:10px;color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:4px}
.card{width:100%;min-height:31px;border:1px solid #3a4960;border-radius:7px;background:#18263b;color:#f6f8fc;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;padding:4px 0;touch-action:manipulation}
.card:active{transform:scale(.97);background:#28405e}
.red{color:#ff7777}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
button.control{border:1px solid var(--line);border-radius:10px;padding:10px;background:#17243a;color:#f5f7fb;font-weight:650;font-size:13px}
button.control:disabled{opacity:.35}
button.reset{border-color:#713b45;color:#ffaaaa}
.note{text-align:center;color:var(--muted);font-size:11px;margin:10px 4px 0;line-height:1.45}
.install{display:none;width:100%;margin-top:9px;border:0;border-radius:10px;padding:11px;background:#1e805a;color:white;font-weight:700}
@media(max-width:360px){body{padding-left:6px;padding-right:6px}.deck{gap:4px}.suit{padding:6px 3px}.card{min-height:29px;font-size:12px}}
</style>
</head>
<body>
<main>
<header><h1>♠ Bhabhi Tracker</h1><span class="tag">OFFLINE READY</span></header>
<section class="stats" aria-live="polite">
 <div class="stat"><div class="num" id="remaining">52</div><div class="sub">CARDS REMAINING</div></div>
 <div class="stat"><div class="num" id="played">0</div><div class="sub">CARDS PLAYED</div></div>
</section>
<div class="track"><div class="fill" id="progress"></div></div>
<section class="deck" id="deck" aria-label="Remaining cards"></section>
<section class="controls">
 <button class="control" id="undo" disabled>↶ Undo</button>
 <button class="control reset" id="reset">Reset game</button>
</section>
<button class="install" id="install">Install app</button>
<p class="note">Tap a card when it is played. It disappears from the grid. Undo restores the last change. Your game is saved automatically on this device.</p>
</main>
<script>
(() => {
 const suits=[{id:'S',symbol:'♠',name:'Spades',red:false},{id:'H',symbol:'♥',name:'Hearts',red:true},{id:'D',symbol:'♦',name:'Diamonds',red:true},{id:'C',symbol:'♣',name:'Clubs',red:false}];
 const ranks=['A','K','Q','J','10','9','8','7','6','5','4','3','2'];
 const KEY='bhabhi-tracker-v1';
 let played=new Set(), history=[];
 try { const saved=JSON.parse(localStorage.getItem(KEY)||'{}'); played=new Set(saved.played||[]); } catch(e){}
 const deck=document.getElementById('deck'), remaining=document.getElementById('remaining'), playedEl=document.getElementById('played'), progress=document.getElementById('progress'), undoBtn=document.getElementById('undo');
 function save(){try{localStorage.setItem(KEY,JSON.stringify({played:[...played]}));}catch(e){}}
 function render(){
  deck.innerHTML='';
  suits.forEach(s=>{
   const section=document.createElement('section'); section.className='suit';
   const head=document.createElement('div'); head.className='suit-head';
   const symbol=document.createElement('div'); symbol.className='symbol'+(s.red?' red':''); symbol.textContent=s.symbol;
   const count=document.createElement('div'); count.className='count';
   const left=ranks.filter(r=>!played.has(s.id+r)).length; count.textContent=left+'/13';
   head.append(symbol,count); section.append(head);
   const cards=document.createElement('div'); cards.className='cards';
   ranks.filter(r=>!played.has(s.id+r)).forEach(r=>{
    const b=document.createElement('button'); b.className='card'+(s.red?' red':''); b.type='button'; b.textContent=r; b.setAttribute('aria-label',r+' of '+s.name);
    b.addEventListener('click',()=>{history.push([...played]);played.add(s.id+r);save();render();});
    cards.append(b);
   });
   section.append(cards); deck.append(section);
  });
  const n=played.size; remaining.textContent=52-n; playedEl.textContent=n; progress.style.width=(n/52*100)+'%'; undoBtn.disabled=!history.length;
 }
 undoBtn.addEventListener('click',()=>{if(!history.length)return;played=new Set(history.pop());save();render();});
 document.getElementById('reset').addEventListener('click',()=>{if(!confirm('Reset all played cards and start a new game?'))return;history.push([...played]);played.clear();save();render();});
 render();
 let deferred;
 const installBtn=document.getElementById('install');
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;installBtn.style.display='block';});
 installBtn.addEventListener('click',async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;installBtn.style.display='none';});
 if('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
